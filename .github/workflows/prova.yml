# Esegue i casi d'uso su una build di prova di Inga: un ramo o un commit di
# matteobaccan/inga (es. exp/web-steps), compilato qui, con uno o più modelli.
#
# Questo file è identico sui rami `main` e `cases` (workflow_dispatch lo prende dal ramo
# scelto, ma GitHub lo mostra solo se c'è su `main`).
#
# - workflow_dispatch: `ref` (ramo o commit di Inga), `modelli` (chiavi di models.json
#   separate da virgole; vuoto = il modello di ogni caso), `case` (casi separati da
#   virgole; vuoto = tutti);
# - in parallelo: un job per ogni caso e modello (`runner.py --matrix`), ognuno compila
#   Inga per conto suo (il binario non esce mai dal suo runner) e, per i casi che lo
#   chiedono, llama.cpp; un ultimo job raccoglie i risultati, scrive un riepilogo per
#   modello, confrontato con l'ultima release in results/, e lo mette nel riepilogo
#   della run. I risultati non vanno sul ramo `cases`: restano come artifact (solo i
#   JSON e i log, mai il binario di Inga).
#
# Segreti: INGA_TOKEN, un token che legge matteobaccan/inga finché è privato; HF_TOKEN
# (facoltativo) per Hugging Face.

name: prova

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ramo o commit di Inga (es. exp/web-steps)"
        required: true
        default: "exp/web-steps"
      modelli:
        description: "Modelli di models.json, separati da virgole (vuoto = quello di ogni caso)"
        required: false
        default: ""
      case:
        description: "Casi separati da virgole (es. pdf,memoria); vuoto = tutti"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: prova-${{ github.event.inputs.ref }}-${{ github.event.inputs.modelli }}-${{ github.event.inputs.case }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cases
          persist-credentials: false
      - id: sha
        env:
          TOKEN: ${{ secrets.INGA_TOKEN || github.token }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          # il commit di Inga da provare, lo stesso per tutti i job
          sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/matteobaccan/inga" "$REF" "refs/heads/$REF" | head -1 | cut -c1-40)
          [ -n "$sha" ] || sha="$REF"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Inga: $REF = $sha"
      - id: m
        env:
          MODELLI: ${{ github.event.inputs.modelli }}
          CASE: ${{ github.event.inputs.case }}
        run: |
          args=(--matrix "$MODELLI")
          IFS=',' read -ra casi <<< "${CASE:-}"
          for c in "${casi[@]}"; do c=$(echo "$c" | tr -d ' '); [ -z "$c" ] || args+=(--case "$c"); done
          m=$(python3 tools/runner.py "${args[@]}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | python3 -m json.tool

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.case }}${{ matrix.model && format(' ({0})', matrix.model) || '' }}
    env:
      IUC_CACHE: /home/runner/iuc-cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cases
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: matteobaccan/inga
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.INGA_TOKEN || github.token }}
          persist-credentials: false
          # dentro il workspace (checkout non accetta altre cartelle); mai caricato
          path: .inga-src
      - uses: dtolnay/rust-toolchain@stable
      - name: Compila inga
        working-directory: .inga-src
        run: |
          # L'output del compilatore resta in un file del runner: i suoi avvisi citano
          # righe del codice di Inga, privato, e i log di questo repository sono pubblici.
          if cargo build --release --bin inga > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "inga compilato"
          else
            echo "la compilazione di inga non è riuscita (il log non è mostrato: codice privato)"
            exit 1
          fi
      - name: llama.cpp
        if: matrix.llama_cpp
        uses: ./.github/actions/llama-cpp
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r tools/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ${{ env.IUC_CACHE }}/models
          key: ${{ matrix.models_key }}
      - name: Chiave della cache delle fonti
        id: fonti
        run: |
          key=$(python -c "import json,hashlib; f=json.load(open('fonti.json'))['fonti']; print(hashlib.sha256(' '.join(sorted(v['url'] + '@' + str(v['sha256']) for v in f.values())).encode()).hexdigest()[:32])")
          echo "key=fonti-$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ env.IUC_CACHE }}/fonti
          key: ${{ steps.fonti.outputs.key }}
      - name: Caso
        id: caso
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REF: ${{ github.event.inputs.ref }}
          SHA: ${{ needs.plan.outputs.sha }}
          MODEL: ${{ matrix.model }}
          CASE: ${{ matrix.case }}
        run: |
          label=$(printf '%s-%s%s' "$REF" "${SHA:0:7}" "${MODEL:+-$MODEL}" | tr -c 'A-Za-z0-9._-' '-')
          echo "label=$label" >> "$GITHUB_OUTPUT"
          args=(--inga "$GITHUB_WORKSPACE/.inga-src/target/release/inga" --label "$label" --case "$CASE")
          [ -z "$MODEL" ] || args+=(--model "$MODEL")
          "$RUNNER_TEMP/venv/bin/python" tools/runner.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: risultato-${{ steps.caso.outputs.label }}-${{ matrix.case }}
          path: |
            results/${{ steps.caso.outputs.label }}/${{ matrix.case }}.json
            ${{ env.IUC_CACHE }}/work/**/*.log
          if-no-files-found: ignore

  summary:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cases
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: risultato-*
          path: ${{ runner.temp }}/r
      - name: Riepilogo per modello
        run: |
          # ogni artifact ha results/<etichetta>/<caso>.json (più i log)
          labels=$(find "$RUNNER_TEMP/r" -path '*/results/*/*.json' | sed -E 's#.*/results/([^/]+)/[^/]+\.json#\1#' | sort -u)
          for l in $labels; do
            mkdir -p "results/$l"
            find "$RUNNER_TEMP/r" -path "*/results/$l/*.json" -exec cp {} "results/$l/" \;
            python3 tools/runner.py --summary-only --label "$l"
            cat "results/$l/summary.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: results-prova
          path: results/*-*/
          if-no-files-found: ignore
