# Esegue i casi d'uso su una versione di Inga.
#
# Questo file è identico sui rami `main` e `cases`: GitHub prende il workflow dal ramo
# `main` per `schedule` e per `workflow_dispatch` lanciato su main, e dal ramo base della
# PR (cioè `cases`) per `pull_request`. Se si cambia, va cambiato su tutti e due.
#
# - workflow_dispatch: `version` (vuoto = l'ultima release) e `case` (vuoto = tutti);
# - schedule: una volta al giorno, solo se l'ultima release non ha ancora risultati in
#   results/ sul ramo `cases`;
# - pull_request verso `cases` (Renovate o una persona che cambia inga-version.txt, i
#   casi o gli strumenti): esegue i casi sulla versione della PR, senza pubblicare nulla.
#
# I casi girano in parallelo, un job `run` per caso (la matrice la scrive
# `runner.py --matrix`), con permessi di sola lettura; i casi che confrontano Inga con
# llama.cpp, o Colibri, li compilano per la CPU del runner (.github/actions/llama-cpp,
# .github/actions/colibri), e quelli con Liyab lo compilano allo stesso modo
# (.github/actions/liyab); quelli con modelli grandi (disco_gb in case.json) liberano
# prima spazio sul disco del runner. Il job `publish` raccoglie i risultati, scrive il
# riepilogo con il runner del ramo `cases` (mai il codice di una PR) e, solo per schedule
# e workflow_dispatch, li salva sul ramo `cases`.
#
# La cache di GitHub tiene i modelli di ogni job (chiave: i loro sha256, da models.json;
# non quelli oltre i 6 GB, che si scaricano ogni volta), llama.cpp e Colibri compilati
# (chiave: versione o commit e CPU) e i PDF che i casi scaricano (chiave: URL e sha256 di
# fonti.json); fonti.yml scarica i PDF e ne stampa il testo nel log.
#
# Segreti (facoltativi): INGA_TOKEN, un token che legge le release di
# matteobaccan/inga finché quel repository è privato; HF_TOKEN per Hugging Face.

name: cases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione di Inga (es. 0.40.0); vuoto = l'ultima release"
        required: false
        default: ""
      case:
        description: "Un caso solo (es. pdf); vuoto = tutti"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    branches: [cases]
    paths:
      - inga-version.txt
      - models.json
      - fonti.json
      - dati.json
      - llama-cpp.txt
      - colibri.txt
      - liyab.txt
      - cases/**
      - tools/**
      - .github/actions/**
      - .github/workflows/cases.yml

permissions:
  contents: read

concurrency:
  group: cases-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'cases-branch' }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      run: ${{ steps.v.outputs.run }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'cases' }}
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ secrets.INGA_TOKEN || github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          latest() { gh api repos/matteobaccan/inga/releases/latest --jq .tag_name | sed 's/^v//'; }
          case "$EVENT" in
            pull_request) version=$(tr -d ' \r\n' < inga-version.txt); run=true ;;
            workflow_dispatch) version="${INPUT_VERSION#v}"; [ -n "$version" ] || version=$(latest); run=true ;;
            schedule)
              version=$(latest)
              if [ -f "results/$version/summary.md" ]; then
                echo "Inga $version ha già i risultati in results/$version: niente da fare."
                run=false
              else
                run=true
              fi ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Versione: $version, esecuzione: $run"
      - id: m
        env:
          CASE: ${{ github.event.inputs.case }}
        run: |
          # un job per caso (il modello di ognuno), in parallelo
          args=(--matrix "")
          IFS=',' read -ra casi <<< "${CASE:-}"
          for c in "${casi[@]}"; do c=$(echo "$c" | tr -d ' '); [ -z "$c" ] || args+=(--case "$c"); done
          m=$(python3 tools/runner.py "${args[@]}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | python3 -m json.tool

  run:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
    name: ${{ matrix.case }}
    env:
      IUC_CACHE: /home/runner/iuc-cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'cases' }}
          persist-credentials: false
      - name: Spazio su disco
        if: matrix.disk_gb > 0
        env:
          NEED: ${{ matrix.disk_gb }}
        run: |
          # i casi con modelli grandi (disco_gb in case.json): via gli SDK che i casi non usano
          free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          echo "Spazio libero: ${free} GB, il caso ne chiede ${NEED}"
          if [ "$free" -lt "$NEED" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
            echo "Dopo la pulizia: ${free} GB"
            [ "$free" -ge "$NEED" ] || echo "::warning::solo ${free} GB liberi, il caso ne chiede ${NEED}"
          fi
      - name: llama.cpp
        if: matrix.llama_cpp
        uses: ./.github/actions/llama-cpp
      - name: Colibri
        if: matrix.colibri
        uses: ./.github/actions/colibri
      - name: Liyab
        if: matrix.liyab
        # una build che non riesce non ferma il job: il caso si dà come saltato
        continue-on-error: true
        uses: ./.github/actions/liyab
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r tools/requirements.txt
      - uses: actions/cache@v6
        # i modelli più grandi della cache di GitHub (10 GB) si scaricano ogni volta
        if: matrix.models_cache
        with:
          path: ${{ env.IUC_CACHE }}/models
          key: ${{ matrix.models_key }}
      - name: Chiave della cache delle fonti
        id: fonti
        run: |
          # i PDF di fonti.json, con la chiave fatta dai loro URL e sha256 (come fonti.yml)
          key=$(python -c "import json,hashlib; f=json.load(open('fonti.json'))['fonti']; print(hashlib.sha256(' '.join(sorted(v['url'] + '@' + str(v['sha256']) for v in f.values())).encode()).hexdigest()[:32])")
          echo "key=fonti-$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ env.IUC_CACHE }}/fonti
          key: ${{ steps.fonti.outputs.key }}
      - name: Caso
        env:
          INGA_TOKEN: ${{ secrets.INGA_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
          CASE: ${{ matrix.case }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" tools/runner.py --version "$VERSION" --case "$CASE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: risultato-${{ matrix.case }}
          path: results/${{ needs.decide.outputs.version }}/${{ matrix.case }}.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: log-${{ matrix.case }}
          path: ${{ env.IUC_CACHE }}/work/**/*.log
          if-no-files-found: ignore

  # Raccoglie i risultati dei job: il riepilogo della run sempre; per schedule e
  # workflow_dispatch li salva anche sul ramo `cases`. Esegue solo il runner del ramo
  # `cases` (--summary-only, nessun caso), mai il codice di una PR.
  publish:
    needs: [decide, run]
    if: always() && needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cases
      - uses: actions/download-artifact@v8
        with:
          pattern: risultato-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - name: Riepilogo
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          n=$(find "$RUNNER_TEMP/results" -name '*.json' 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "Nessun risultato scritto dai job." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "results/$VERSION"
          cp "$RUNNER_TEMP"/results/*.json "results/$VERSION/"
          python3 tools/runner.py --summary-only --version "$VERSION"
          cat "results/$VERSION/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Salva i risultati sul ramo cases
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          [ -d "results/$VERSION" ] || exit 0
          git add "results/$VERSION"
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei risultati."
            exit 0
          fi
          git -c user.name="Matteo Baccan" -c user.email=matteo.baccan@gmail.com commit -m "Risultati di Inga $VERSION"
          for i in 1 2 3; do
            git pull --no-rebase --no-edit origin cases && git push origin cases && exit 0
            sleep 5
          done
          exit 1
